name: Deploy server

# Setiap push ke main otomatis tarik kode ke server, build, lalu restart.
# Kunci yang dipakai:
#   secrets.DEPLOY_SSH_KEY   -> private key runner ke server (ditambahkan ke
#                              ~/.ssh/authorized_keys milik user deploy)
#   secrets.DEPLOY_HOST      -> alamat SSH server, mis. 192.168.0.50
#   secrets.DEPLOY_USER      -> user SSH, mis. mahora
#
# Server melakukan git pull memakai deploy key ~/.ssh/github_deploy yang
# public key-nya sudah terdaftar sebagai Deploy key di repo ini.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & restart tiket-app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Jalankan deploy di server
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              'bash /var/www/tiket-app/deploy.sh'